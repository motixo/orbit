[package]
name = "orbit"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "A floating file shelf for the COSMIC desktop"

[dependencies]
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.8"
url = "2.5"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170"
features = ["single-instance", "wayland", "xdg-portal"]

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
