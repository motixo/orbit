[package]
name = "orbit"
version = "0.4.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "A floating file shelf for the COSMIC desktop"

[dependencies]
base64 = "0.22.1"
csscolorparser = "0.8.4"
flate2 = "1.1"
image = { version = "0.25.10", default-features = false }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
jiff = "0.2"
mime_guess = "2.0"
notify = "8.2.1"
percent-encoding = "2.3"
quick-xml = { version = "0.41", features = ["escape-html"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
roxmltree = "0.20"
ron = "0.12"
rust-embed = "8.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
tempfile = "3.27"
tar = "0.4"
url = "2.5"
uuid = { version = "1.29", features = ["v4"] }
unicode-segmentation = "1.13.3"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
zip = { version = "3", default-features = false, features = ["deflate-flate2", "jiff-02"] }
ksni = "0.3.7"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170"
features = ["applet", "process", "single-instance", "surface-message", "wayland", "xdg-portal"]

[dependencies.iced_winit]
git = "https://github.com/pop-os/libcosmic"
rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170"
default-features = false

[dependencies.iced_accessibility]
git = "https://github.com/pop-os/libcosmic"
rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
