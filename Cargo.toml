[package]
name = "orbit"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "A floating file shelf for the COSMIC desktop"

[dependencies]
base64 = "0.22.1"
image = { version = "0.25.10", default-features = false }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
percent-encoding = "2.3"
quick-xml = { version = "0.41", features = ["escape-html"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
roxmltree = "0.20"
rust-embed = "8.8"
tempfile = "3.27"
url = "2.5"
uuid = { version = "1.29", features = ["v4"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170"
features = ["process", "single-instance", "surface-message", "wayland", "xdg-portal"]

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
